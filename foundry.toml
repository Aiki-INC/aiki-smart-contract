[profile.default]
src = "src"
out = "out"
libs = ["lib"]

solc = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = true

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/"
]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[fmt]
line_length = 100
tab_width = 2
bracket_spacing = true